<div class="login-container">
  <div class="login-left">
    <h2>Sign In</h2>
    <div class="social-buttons">
      <button type="button" title="Home" (click)="goToHome()"><i class="fa fa-home"></i></button>
      <button title="Google" type="button" (click)="openGoogle()"><i class="fab fa-google"></i></button>
      <button title="Facebook" type="button" (click)="openFacebook()"><i class="fab fa-facebook-f"></i></button>
      <button type="button" title="LinkedIn"><i class="fab fa-linkedin-in"></i></button>
    </div>

    <div class="or-text">or use your email and password</div>

    <form (ngSubmit)="loginUser()" #form="ngForm" novalidate>
      <input
        class="login-input"
        type="email"
        placeholder="Email"
        required
        [(ngModel)]="user.email"
        name="email"
        #email="ngModel"
        autocomplete="username"
      />
      <div class="error" *ngIf="email.invalid && email.touched" style="color: red; font-size: 0.9rem;">
        Please enter a valid email.
      </div>

      <input
        class="login-input"
        type="password"
        placeholder="Password"
        required
        [(ngModel)]="user.password"
        name="password"
        #password="ngModel"
        autocomplete="current-password"
      />
      <div class="error" *ngIf="password.invalid && password.touched" style="color: red; font-size: 0.9rem;">
        Password is required.
      </div>

      <select
        class="login-input"
        required
        [(ngModel)]="user.type"
        name="type"
        #type="ngModel"
      >
        <option value="" disabled selected>User Type</option>
        <option value="General Direction">General Direction</option>
        <option value="Department Heads">Department Heads</option>
        <option value="Technical Managers">Technical Managers</option>
        <option value="Medical Teams">Medical Teams</option>
      </select>
      <div class="error" *ngIf="type.invalid && type.touched" style="color: red; font-size: 0.9rem;">
        Please select a user type.
      </div>

      <div class="forgot">
        <a href="#">&#8212; Forget Your Password? &#8212;</a>
      </div>

      <button class="login-btn" type="submit" [disabled]="form.invalid">SIGN IN</button>
    </form>
  </div>

  <div class="login-right">
    <img src="assets/logo.png" alt="Logo" class="logo" />
    <h2>Hello, Friend!</h2>
    <p>Register with your personal details to use all of the site features</p>
    <button class="signup-btn" type="button" (click)="goToAuth()">SIGN UP</button>
  </div>
</div>
